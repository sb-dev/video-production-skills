name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate TypeScript source and repository contracts
        run: npm test
      - name: Install deterministic media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick
      - name: Smoke deterministic TypeScript scripts
        run: npm run smoke:scripts

  skill-discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Agent Skills discovery
        run: npx -y skills add . --list
